name: Packages

# Builds the editor's packages with a tagged yakbd-cli release: the Linux AppImage (and its runtime's sources), one
# Windows yakbd-gui-setup.exe (the components YAKBD Editor for x64 and arm64, built natively with MSVC on x64 and
# arm64 runners, and YAKBD CLI for x86/x64/arm64; installed, changed and removed again on both), the macOS .dmg
# (universal, unsigned).
# By default the latest tagged CLI release, verified by SHA256SUMS and its build provenance attestation.
# Windows and macOS jobs are manual to save CI minutes (they are slow): run it when a check or a release needs it.
# The packages are workflow artifacts. With a version, a last job collects them into a DRAFT release (tag v<version>,
# SHA256SUMS, build provenance attestations); a maintainer publishes it.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which packages"
        type: choice
        options: [all, windows, macos, linux]
        default: all
      cli:
        description: "yakbd-cli release tag (empty: the latest release)"
        type: string
        default: ""
      cli_source_only:
        description: "Take the CLI from the tag's source only (a draft CLI release; Windows packages only, no release)"
        type: boolean
        default: false
      version:
        description: "Release version: 0.1.0-preview.N or 0.1.0-rehearsal.N (empty: packages only, no release)"
        type: string
        default: ""

permissions:
  contents: read

env:
  # The editor's full version in every package (CMake YAKBD_GUI_VERSION_FULL); "-dev" without a release.
  FULL: ${{ inputs.version != '' && inputs.version || '0.1.0-dev' }}

jobs:
  cli:
    name: yakbd CLI release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
          WANT: ${{ inputs.cli }}
          SOURCE_ONLY: ${{ inputs.cli_source_only }}
        run: |
          if [ -n "$VERSION" ]; then
            echo "$VERSION" | grep -Eqx '0\.1\.0-(preview\.[0-9]+|rehearsal\.[0-9]+)' || { echo "::error::version $VERSION is not accepted"; exit 1; }
            [ "$PLATFORMS" = all ] || { echo "::error::a release needs platforms=all"; exit 1; }
            [ -n "$WANT" ] || { echo "::error::a release names its yakbd-cli tag explicitly (input cli)"; exit 1; }
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then echo "::error::tag v$VERSION exists"; exit 1; fi
          fi
          if [ "$SOURCE_ONLY" = true ]; then
            [ -z "$VERSION" ] || { echo "::error::a release takes the CLI from its published release, not from source"; exit 1; }
            [ "$PLATFORMS" = windows ] || { echo "::error::cli_source_only builds the Windows packages only"; exit 1; }
            [ -n "$WANT" ] || { echo "::error::cli_source_only needs the tag (input cli)"; exit 1; }
          fi
          tag="$WANT"
          if [ -z "$tag" ]; then tag=$(gh release view -R yakbd/yakbd-cli --json tagName -q .tagName); fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "yakbd-cli $tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Go version of the CLI release (its Windows builds are reproducible only with that exact Go)
        id: gover
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: echo "go=$(curl -fsSL "https://raw.githubusercontent.com/yakbd/yakbd-cli/$TAG/installer/stub-386.version" | sed 's/^go//' | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.gover.outputs.go }}
          cache: false
      - name: Download, verify, rebuild the Windows yakbd.exe and compare
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          sh packaging/cli-release.sh "$TAG" cli ${{ inputs.cli_source_only && '--source-only' || '' }}
          rm -rf cli/src
          cat cli/exe-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: cli/
          retention-days: 3

  linux:
    needs: cli
    if: inputs.platforms == 'all' || inputs.platforms == 'linux'
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 40
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - run: sh tools/linux-build-deps.sh
      - uses: actions/download-artifact@v4
        with:
          name: cli
          path: cli
      - uses: actions/cache@v4
        with:
          path: /opt/qt-downloads
          key: qt-linux_gcc_64-${{ hashFiles('tools/qt-pins.cmake') }}
      - run: cmake -DPLATFORM=linux_gcc_64 -DDEST=/opt/qt -DDOWNLOADS=/opt/qt-downloads -P tools/getqt.cmake
      - name: Build and test
        env:
          YAKBD_REQUIRE_CLI: 1
          LANG: C.UTF-8
          TAG: ${{ needs.cli.outputs.tag }}
        run: |
          cli=$PWD/cli/linux-amd64/yakbd
          chmod +x "$cli"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/opt/qt -DYAKBD_CLI="$cli" -DYAKBD_GUI_VERSION_FULL="$FULL"
          cmake --build build
          ctest --test-dir build --output-on-failure --timeout 300
          sh packaging/linux/package.sh build "$cli" dist cli
          # The package reports the release version.
          (cd /tmp && "$OLDPWD/dist/yakbd-gui-x86_64.AppImage" --appimage-extract >/dev/null)
          /tmp/squashfs-root/AppRun --self-test tests/data/minimal-qwerty.kbl.json > /tmp/st.txt
          cat /tmp/st.txt
          grep -qx "YAKBD Editor $FULL" /tmp/st.txt
      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: dist/*
          retention-days: 5

  windows:
    name: windows (${{ matrix.arch }})
    needs: cli
    if: inputs.platforms == 'all' || inputs.platforms == 'windows'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-2025, qt: win64_msvc2022_64 }
          - { arch: arm64, runner: windows-11-arm, qt: win64_msvc2022_arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cli
          path: cli
      - uses: actions/cache@v4
        with:
          path: C:\qt-downloads
          key: qt-${{ matrix.qt }}-${{ hashFiles('tools/qt-pins.cmake') }}
      - name: Qt (pinned archives)
        run: cmake -DPLATFORM=${{ matrix.qt }} -DDEST=C:/qt -DDOWNLOADS=C:/qt-downloads -P tools/getqt.cmake
      - name: Build, test, payload (MSVC, native ${{ matrix.arch }})
        env:
          YAKBD_REQUIRE_CLI: 1
          QT_QPA_PLATFORM: offscreen
          TAG: ${{ needs.cli.outputs.tag }}
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          $host_arch = if ("${{ matrix.arch }}" -eq "arm64") { "arm64" } else { "amd64" }
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=$host_arch -host_arch=$host_arch"
          $v = $env:TAG.TrimStart("v")
          $cli = (Resolve-Path "cli/windows-${{ matrix.arch }}/yakbd.exe").Path
          "CLI=$cli" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=C:/qt -DYAKBD_CLI="$cli" -DYAKBD_GUI_VERSION_FULL="$env:FULL" -DYAKBD_QT_SUBFOLDER=ON
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          cmake --build build
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          $env:PATH = "C:/qt/bin;$env:PATH"
          ctest --test-dir build --output-on-failure --timeout 300
          # A test failure fails the job at the end, after the payload and its own checks (they show more).
          "TESTS_EXIT=$LASTEXITCODE" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          if ($LASTEXITCODE -ne 0) { Get-Content build/tests/tst_window.txt -ErrorAction SilentlyContinue }
          pwsh packaging/windows/package.ps1 -Build build -Arch ${{ matrix.arch }} -Out dist
          if ($LASTEXITCODE -ne 0) { throw "payload failed" }
      # Signing (later, SignPath): sign dist/payload-*/yakbd-gui.exe here, before the setup is made.
      - name: Install layout without PATH; self-test and screenshots (FluentWinUI3, light and dark)
        run: |
          # The installed layout: YAKBD\Editor\ (the payload: Qt in qt\, found through the exe's manifest) and
          # YAKBD\CLI\yakbd.exe. PATH holds only Windows itself, so neither Qt nor the CLI can come from PATH.
          $root = Join-Path $env:RUNNER_TEMP "YAKBD"
          Copy-Item -Recurse "dist/payload-${{ matrix.arch }}" (Join-Path $root "Editor")
          New-Item -ItemType Directory (Join-Path $root "CLI") | Out-Null
          Copy-Item $env:CLI (Join-Path $root "CLI\yakbd.exe")
          $loose = Get-ChildItem (Join-Path $root "Editor\*.dll")
          if ($loose) { throw "DLLs beside yakbd-gui.exe: $($loose.Name -join ', ')" }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:YAKBD_CLI -ErrorAction SilentlyContinue
          $exe = Join-Path $root "Editor\yakbd-gui.exe"
          $st = Start-Process -PassThru -Wait $exe -ArgumentList @("--self-test", "tests/data/latin-altgr-deadkeys.kbl.json") -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($st.ExitCode -ne 0) { throw "self-test failed" }
          if (-not (Select-String -Quiet -Path selftest.txt -Pattern "^YAKBD Editor $([regex]::Escape($env:FULL))$")) { throw "the payload does not report $env:FULL" }
          if (-not (Select-String -Quiet -SimpleMatch -Path selftest.txt -Pattern "($root\CLI\yakbd.exe) validates")) { throw "the editor did not use ..\CLI\yakbd.exe" }
          # The Qt modules came from qt\ (the private assembly), not from anywhere else.
          $p = Start-Process -PassThru $exe -ArgumentList @("--size", "800x600", "tests/data/latin-altgr-deadkeys.kbl.json")
          Start-Sleep 6
          $mods = (Get-Process -Id $p.Id).Modules.FileName
          Stop-Process -Id $p.Id
          $qtmods = $mods | Where-Object { (Split-Path -Leaf $_) -like "Qt6*.dll" }
          $qtmods | ForEach-Object { Write-Host "loaded $_" }
          if (-not $qtmods) { throw "no Qt module loaded" }
          $elsewhere = $qtmods | Where-Object { -not $_.StartsWith((Join-Path $root "Editor\qt\"), "OrdinalIgnoreCase") }
          if ($elsewhere) { throw "Qt loaded from outside Editor\qt\: $elsewhere" }
          New-Item -ItemType Directory shots | Out-Null
          foreach ($mode in "light", "dark") {
            $p = Start-Process -PassThru -Wait $exe -ArgumentList @("--appearance", $mode, "--size", "1360x860", "--grab", "shots/keyboard-$mode.png", "--grab-delay", "4000", "--select", "/hardware/layers/4/bindings/KeyE", "tests/data/latin-altgr-deadkeys.kbl.json")
            if ($p.ExitCode -ne 0) { throw "grab $mode failed" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: payload-${{ matrix.arch }}
          path: dist/payload-${{ matrix.arch }}/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-windows-${{ matrix.arch }}
          path: shots/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Test result
        run: if ($env:TESTS_EXIT -ne "0") { throw "ctest failed (exit $env:TESTS_EXIT); see Build, test, payload" }

  windows-setup:
    name: windows setup
    needs: [cli, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cli
          path: cli
      - uses: actions/download-artifact@v4
        with:
          pattern: payload-*
          path: payloads
      - name: CLI source at the tag (its installer machinery)
        run: git -c core.autocrlf=false -c advice.detachedHead=false clone -q --depth 1 --branch "${{ needs.cli.outputs.tag }}" https://github.com/yakbd/yakbd-cli cli-src
      - name: Go version of the CLI release (its installer build is reproducible only with that exact Go)
        id: gover
        run: echo "go=$(sed 's/^go//' cli-src/installer/stub-386.version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.gover.outputs.go }}
          cache: false
      - name: yakbd-gui-setup.exe (the editor for x64 and arm64; the CLI for x86, x64, arm64)
        run: |
          mkdir dist
          sh packaging/windows/make-setup.sh cli-src payloads/payload-x64 payloads/payload-arm64 cli/exe-sha256.txt "$FULL" dist/yakbd-gui-setup.exe
      # Signing (later, SignPath): sign dist/yakbd-gui-setup.exe here.
      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: dist/yakbd-gui-setup.exe
          retention-days: 5

  windows-setup-test:
    name: windows setup test (${{ matrix.arch }})
    needs: windows-setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-2025 }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages-windows
          path: setup
      - name: Install (defaults), use, remove the editor, uninstall
        run: |
          $setup = (Resolve-Path setup/yakbd-gui-setup.exe).Path
          $root = Join-Path $env:ProgramW6432 "YAKBD"
          $cli = Join-Path $root "CLI"
          $ed = Join-Path $root "Editor"
          $entry = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{F257BACA-1D4A-509F-9245-821ACEAAA3CC}"
          $lnk = Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs\YAKBD Editor.lnk"
          function MachinePath { [Environment]::GetEnvironmentVariable("Path", "Machine") -split ";" | Where-Object { $_ } }
          function Run($what, [string[]] $arguments) {
            $p = Start-Process -PassThru -Wait $setup -ArgumentList ($arguments + @("/quiet", "/norestart", "/l*v", "$what.log"))
            if ($p.ExitCode -ne 0) { Get-Content "$what.log" -Tail 40; throw "${what}: exit $($p.ExitCode)" }
          }

          # 1. /quiet without properties = the wizard's defaults: YAKBD Editor and YAKBD CLI, PATH off.
          Run "install" @()
          foreach ($f in "yakbd.exe", "LICENSE", "NOTICE") {
            if (-not (Test-Path (Join-Path $cli $f))) { throw "missing after install: CLI\$f" }
          }
          foreach ($f in "yakbd-gui.exe", "qt.conf", "qt\qt.manifest", "qt\Qt6Core.dll", "qt\plugins\platforms\qwindows.dll",
                     "LICENSE", "NOTICE", "licenses\LGPL-3.0.txt") {
            if (-not (Test-Path (Join-Path $ed $f))) { throw "missing after install: Editor\$f" }
          }
          if (Get-ChildItem (Join-Path $ed "*.dll")) { throw "DLLs beside yakbd-gui.exe" }
          if ((MachinePath) -contains $cli) { throw "the editor installer's default put YAKBD\CLI on PATH" }
          $e = Get-ItemProperty $entry
          Write-Host "entry: $($e.DisplayName) $($e.DisplayVersion) [$($e.YakbdComponents)] CLI $($e.YakbdCLIVersion) editor $($e.YakbdEditorVersion)"
          if ($e.DisplayName -ne "YAKBD" -or $e.DisplayVersion -ne $env:FULL -or $e.YakbdComponents -ne "CLI,Editor") { throw "unexpected Installed apps entry" }
          $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          if ($sc.TargetPath -ne (Join-Path $ed "yakbd-gui.exe")) { throw "the shortcut points at '$($sc.TargetPath)'" }
          Write-Host "shortcut: $lnk -> $($sc.TargetPath)"

          # 2. The installed editor with a PATH of Windows only: Qt from Editor\qt\, the CLI from ..\CLI\.
          $saved = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $st = Start-Process -PassThru -Wait (Join-Path $ed "yakbd-gui.exe") -ArgumentList @("--self-test", "tests/data/latin-altgr-deadkeys.kbl.json") -RedirectStandardOutput selftest.txt
          $env:PATH = $saved
          Get-Content selftest.txt
          if ($st.ExitCode -ne 0) { throw "installed editor: self-test failed" }
          if (-not (Select-String -Quiet -Path selftest.txt -Pattern "^YAKBD Editor $([regex]::Escape($env:FULL))$")) { throw "the installed editor does not report $env:FULL" }
          if (-not (Select-String -Quiet -Path selftest.txt -SimpleMatch "($(Join-Path $cli 'yakbd.exe')) validates")) { throw "the editor did not use CLI\yakbd.exe" }
          Write-Host "CLI: $(& (Join-Path $cli 'yakbd.exe') version)"

          # 3. Remove the editor only, with the user's settings: the CLI stays.
          New-Item -Force "HKCU:\Software\YAKBD\YAKBD Editor" | Out-Null
          Set-ItemProperty "HKCU:\Software\YAKBD\YAKBD Editor" appearance dark
          Run "remove-editor" @("REMOVE=Editor", "REMOVEUSERDATA=1")
          if (Test-Path $ed) { throw "REMOVE=Editor left $ed" }
          if (Test-Path $lnk) { throw "REMOVE=Editor left the shortcut" }
          if (Test-Path "HKCU:\Software\YAKBD") { throw "REMOVEUSERDATA=1 left the editor's settings" }
          if (-not (Test-Path (Join-Path $cli "yakbd.exe"))) { throw "REMOVE=Editor removed the CLI" }
          if ((Get-ItemProperty $entry).YakbdComponents -ne "CLI") { throw "the entry does not record the CLI alone" }

          # 4. Uninstall everything.
          Run "uninstall" @("/x")
          if (Test-Path $root) { throw "uninstall left $root" }
          if (Test-Path $entry) { throw "uninstall left the Installed apps entry" }
          Write-Host "installed, self-tested, editor removed and uninstalled on ${{ matrix.arch }}"

  macos:
    needs: cli
    if: inputs.platforms == 'all' || inputs.platforms == 'macos'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cli
          path: cli
      - uses: actions/cache@v4
        with:
          path: ~/qt-downloads
          key: qt-clang_64-${{ hashFiles('tools/qt-pins.cmake') }}
      - run: cmake -DPLATFORM=clang_64 -DDEST=$HOME/qt -DDOWNLOADS=$HOME/qt-downloads -P tools/getqt.cmake
      - name: Build and test
        env:
          YAKBD_REQUIRE_CLI: 1
          TAG: ${{ needs.cli.outputs.tag }}
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x cli/macos/yakbd
          cli=$PWD/cli/macos/yakbd
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$HOME/qt \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DYAKBD_CLI="$cli" -DYAKBD_GUI_VERSION_FULL="$FULL"
          cmake --build build --parallel
          # A test failure fails the job at the end, after the package and the desktop checks (they show more).
          ctest --test-dir build --output-on-failure --timeout 300 || echo "TESTS_FAILED=1" >> "$GITHUB_ENV"
      - name: Package
        env:
          TAG: ${{ needs.cli.outputs.tag }}
        run: |
          sh packaging/macos/package.sh build cli/macos/yakbd dist cli
      - name: Self-test and screenshots of the package (macOS style, light and dark)
        run: |
          hdiutil attach dist/*.dmg -mountpoint /tmp/yakbd -nobrowse
          app="/tmp/yakbd/YAKBD Editor.app/Contents/MacOS"
          lipo -info "$app/YAKBD Editor" "$app/yakbd"
          # The licence texts travel in the .dmg: the editor's, Qt's and the CLI's.
          for f in LICENSE NOTICE yakbd-cli-LICENSE yakbd-cli-NOTICE licenses/LGPL-3.0.txt licenses/GPL-3.0.txt; do
            test -s "/tmp/yakbd/YAKBD Editor.app/Contents/Resources/$f" || { echo "the .dmg lacks $f"; exit 1; }
          done
          echo "licence files in the .dmg: ok"
          "$app/YAKBD Editor" --self-test tests/data/latin-altgr-deadkeys.kbl.json > /tmp/st.txt
          cat /tmp/st.txt
          grep -qx "YAKBD Editor $FULL" /tmp/st.txt
          mkdir shots
          for mode in light dark; do
            "$app/YAKBD Editor" --appearance $mode --size 1360x860 --grab shots/keyboard-$mode.png --grab-delay 4000 \
              --select /hardware/layers/4/bindings/KeyE tests/data/latin-altgr-deadkeys.kbl.json
          done
          # What a person checks on a Mac, as far as the runner allows (menus, live dark switch, native dialog).
          sh tools/macos-desktop-check.sh "$app" "$PWD/tests/data/latin-altgr-deadkeys.kbl.json" shots | tee shots/desktop.txt
          { echo "### macOS desktop checks"; echo '```'; grep "^RESULT" shots/desktop.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          hdiutil detach /tmp/yakbd
      - uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          path: dist/*
          retention-days: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-macos
          path: shots/
          if-no-files-found: warn
          retention-days: 14
      - name: Test result
        run: if [ -n "${TESTS_FAILED:-}" ]; then echo "::error::ctest failed; see Build and test"; exit 1; fi

  release:
    name: Draft release
    needs: [cli, linux, windows, windows-setup, windows-setup-test, macos]
    if: inputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: collected
      - name: Collect the release files
        env:
          V: ${{ inputs.version }}
        run: |
          mkdir release
          want="yakbd-gui-setup.exe yakbd-gui.dmg yakbd-gui-x86_64.AppImage appimage-runtime-sources-$V.tar.gz"
          for f in $want; do
            src=$(find collected -type f -name "$f" | head -1)
            # The AppImage runtime's sources (libfuse, LGPL-2.1) are owed with the AppImage (NOTICE): none, no release.
            [ -n "$src" ] || { echo "::error::$f is missing"; exit 1; }
            cp "$src" release/
          done
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*
      - name: Tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ inputs.version }}
          CLI_TAG: ${{ needs.cli.outputs.tag }}
        run: |
          sed -e "s/@VERSION@/$V/g" -e "s/@CLI_TAG@/$CLI_TAG/g" -e "s/@CLI_VERSION@/${CLI_TAG#v}/g" \
            packaging/RELEASE-NOTES.md > notes.md
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$V" -f sha="$GITHUB_SHA" >/dev/null
          gh release create "v$V" release/* --draft --verify-tag --title "YAKBD Editor $V" --notes-file notes.md
          echo "draft release v$V" >> "$GITHUB_STEP_SUMMARY"
